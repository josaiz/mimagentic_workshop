services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.1
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:9092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "9092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.3.0
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking"]
      interval: 5s
      timeout: 5s
      retries: 10

  movement-orchestrator:
    build:
      context: ..
      dockerfile: services/movement-orchestrator/Dockerfile
    environment:
      PORT: 3001
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      redpanda:
        condition: service_healthy

  event-log-service:
    build:
      context: ..
      dockerfile: services/event-log-service/Dockerfile
    environment:
      PORT: 3002
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3002:3002"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    environment:
      PORT: 3003
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3003:3003"
    depends_on:
      redpanda:
        condition: service_healthy

  external-transfer-service:
    build:
      context: ..
      dockerfile: services/external-transfer-service/Dockerfile
    environment:
      PORT: 3004
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3004:3004"
    depends_on:
      redpanda:
        condition: service_healthy

  account-service:
    build:
      context: services/account-service
    environment:
      SERVER_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8081:8081"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mortgage-service:
    build:
      context: services/mortgage-service
    environment:
      SERVER_PORT: 8082
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8082:8082"
    depends_on:
      redpanda:
        condition: service_healthy

  investment-service:
    build:
      context: services/investment-service
    environment:
      SERVER_PORT: 8083
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8083:8083"
    depends_on:
      redpanda:
        condition: service_healthy

  web-dashboard:
    build:
      context: ..
      dockerfile: apps/web-dashboard/Dockerfile
    environment:
      NEXT_PUBLIC_ACCOUNT_SERVICE_URL: http://localhost:8081
      NEXT_PUBLIC_EVENT_LOG_SERVICE_URL: http://localhost:3002
      NEXT_PUBLIC_MOVEMENT_ORCHESTRATOR_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - account-service
      - movement-orchestrator
      - event-log-service
